<!doctype html>

    <title>Home</title>
    <script src="main.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

          width="16"
          height="16"
          fill="currentColor"
          class="cursor-pointer hover:fill-pink-700 stroke-3 h-7 w-7 bi bi-list"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"

            >Home</a
          >
        </li>
        <li>
          <a
            data-nav="about"
            href="#"
            class="hover:text-pink-200 cursor-pointer"
            >About</a
          >
        </li>
        <li>
          <a
            data-nav="services"
            href="#"
            class="hover:text-pink-200 cursor-pointer"
            >Services</a
          >
        </li>
        <li>
          <a
            data-nav="signin"
            href="#"
            class="hover:text-pink-200 cursor-pointer"
            >Sign in</a
          >
        </li>
      </ul>
    </div>
    <div

      class="bg-gray-700 w-screen h-50 py-2 sm:hidden hidden"
    >
      <ul class="text-white px-4 flex flex-col gap-1">
        <li>
          <a data-nav="home" href="#" class="hover:text-pink-200 cursor-pointer"
            >Home</a
          >
        </li>
        <li>
          <a
            data-nav="about"
            href="#"
            class="hover:text-pink-200 cursor-pointer"
            >About</a
          >
        </li>
        <li>
          <a
            data-nav="services"
            href="#"
            class="hover:text-pink-200 cursor-pointer"
            >Services</a
          >
        </li>
        <li>
          <a
            data-nav="signin"
            href="#"

          >
        </li>
      </ul>

    <div
      class="main flex justify-center items-center w-[100vw] h-[calc(100vh-36px)] text-white"
    >
